name: Sync-All-Clusters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '*.js'
      - '*.json'
      - '*.py'
      - '*.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Cluster-3
            token_secret: CLUSTER_3_PAT
            target: "asrarkhann125-cloud/Xploit-hub-vps"
          - name: Cluster-4
            token_secret: CLUSTER_4_PAT
            target: "asrarkhann127-glitch/Xploit-hub-vps"
          - name: Cluster-5
            token_secret: CLUSTER_5_PAT
            target: "raufs6801-maker/Bro-vpes"
          - name: Cluster-6
            token_secret: CLUSTER_6_PAT
            target: "asrarkhann120-hue/Xploit-hub-vps"
          - name: Cluster-7
            token_secret: CLUSTER_7_PAT
            target: "asrarkhann128-png/Xploit-hub-vps"
          - name: Cluster-8
            token_secret: CLUSTER_8_PAT
            target: "asrarkhann124-boop/Xploit-hub-vps"
          - name: Cluster-9
            token_secret: CLUSTER_9_PAT
            target: "asrarkhann132-afk/maybe-we-need-deployment"
          # - name: Cluster-10 (Suspended)
          #   token_secret: CLUSTER_10_PAT
          #   target: "asrarkhann114-hash/literate-engine"
          - name: Cluster-11
            token_secret: CLUSTER_11_PAT
            target: "asrarkhann135-sudo/fictional-barnacle"
    steps:
      - name: Checkout Mother Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to ${{ matrix.name }}
        env:
          CLUSTER_PAT: ${{ secrets[matrix.token_secret] }}
        run: |
          if [ -z "$CLUSTER_PAT" ]; then
            echo "⚠️ No PAT found for ${{ matrix.name }}, skipping..."
            exit 0
          fi
          # Stealth: orphan branch with generic author — zero trace to Mother
          git checkout --orphan stealth-push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project files"
          git remote add cluster https://x-access-token:${CLUSTER_PAT}@github.com/${{ matrix.target }}.git
          git push cluster stealth-push:main --force
          echo "✅ Synced to ${{ matrix.name }} (${{ matrix.target }})"
